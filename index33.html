        /* Add new loading spinner styles */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        .loading-text {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Add loading progress bar styles */
        .progress-bar {
            width: 200px;
            height: 10px;
            background-color: #f3f3f3;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

body {

form div {

label {

input {

button:hover {

}

    color: white;
    margin-right: 15px;
}

    margin: 20px 0;

}

<body>
    <!-- Add loading overlay -->
    <div class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Uploading...</div>
        <div class="progress-bar">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="success-modal">
        <div class="success-content">
            <div class="success-icon">✓</div>
            <div class="success-title">Purchase Successfully Added</div>
            <div class="success-details">
                <p><strong>Date:</strong> <span class="success-date"></span></p>
                <p><strong>Gallons:</strong> <span class="success-gallons"></span></p>
                <p><strong>Price:</strong> $<span class="success-price"></span>/gallon</p>
                <p><strong>Total:</strong> $<span class="success-total"></span></p>
                <p><strong>Location:</strong> <span class="success-location"></span></p>
                <p><strong>Odometer:</strong> <span class="success-odometer"></span></p>
            </div>
            <button class="success-button">Continue</button>
        </div>
    </div>

    <nav>
        <div class="container">
            <a href="history33.html">Fuel Purchase History</a>
            <a href="go2.html">Add DEF</a>
            <span id="user-info"></span>
            <button id="logout-button">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h1>Add Fuel Purchase</h1>
        <form id="fuel-form">
            <div>
                <input type="date" id="date" required>
            </div>
            <div>
                <input type="number" id="gallons" placeholder="Gallons" step="0.01" required>
            </div>
            <div>
                <input type="number" id="price" placeholder="Price per Gallon ($)" step="0.01" required>
            </div>
            <div>
                <input type="number" id="odometer" placeholder="Odometer" required>
            </div>
            <div>
                <input type="text" id="location" placeholder="Current Location (City,State)" required readonly>
            </div>
            <div>
                <input type="file" id="pdf-upload" accept="application/pdf" required>
            </div>
            <div>
                <button type="submit" id="submit-button">Add Fuel Purchase</button>
            </div>
        </form>
    </div>

    <script>
        // Initialize Firebase (replace with your own config)
        const firebaseConfig = {
              apiKey: "AIzaSyDTutCGdUeopdBpR-yYKdOn8UXwy1UQ1t8",
              authDomain: "fuel-f60f7.firebaseapp.com",
              databaseURL: "https://fuel-f60f7-default-rtdb.firebaseio.com",
              projectId: "fuel-f60f7",
              storageBucket: "fuel-f60f7.appspot.com",
              messagingSenderId: "286098349793",
              appId: "1:286098349793:web:182f10dc0fea18423c21a0",
              measurementId: "G-4N6DZ5FTKM"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();
        const auth = firebase.auth();

        // Get DOM elements
        const fuelForm = document.getElementById('fuel-form');
        const pdfUpload = document.getElementById('pdf-upload');
        const logoutButton = document.getElementById('logout-button');
        const userInfo = document.getElementById('user-info');
        const locationInput = document.getElementById('location');
        const loadingOverlay = document.querySelector('.loading-overlay');
        const loadingText = document.querySelector('.loading-text');
        const progressBarFill = document.querySelector('.progress-bar-fill');
        const submitButton = document.getElementById('submit-button');
        // Add new DOM elements for success modal
        const successModal = document.querySelector('.success-modal');
        const successButton = document.querySelector('.success-button');

        
        // Check authentication state
        auth.onAuthStateChanged(function(user) {
            if (user) {
                userInfo.textContent = `Logged in as: ${user.email}`;
                fuelForm.style.display = 'block';
                useCurrentLocation(); // Get user's current location on load
            } else {
                window.location.href = 'index.html';
            }
        });

        // Logout functionality
        logoutButton.addEventListener('click', function() {
            auth.signOut().then(function() {
                window.location.href = 'index.html';
            }).catch(function(error) {
                console.error('Logout error:', error);
            });
        });

        function useCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const latLng = new google.maps.LatLng(position.coords.latitude, position.coords.longitude);
                    const geocoder = new google.maps.Geocoder();
                    geocoder.geocode({ 'location': latLng }, function(results, status) {
                        if (status === 'OK') {
                            if (results[0]) {
                                const addressComponents = results[0].address_components;
                                const city = addressComponents.find(component => component.types.includes("locality")).long_name;
                                const state = addressComponents.find(component => component.types.includes("administrative_area_level_1")).short_name;
                                locationInput.value = `${city},${state}`;
                            } else {
                                window.alert('No results found');
                            }
                        } else {
                            window.alert('Geocoder failed due to: ' + status);
                        }
                    });
                }, function() {
                    window.alert('Unable to get current location');
                });
            } else {
                window.alert('Geolocation is not supported by this browser.');
            }
        }
        // Add success button click handler
        successButton.addEventListener('click', () => {
            successModal.style.display = 'none';
            fuelForm.reset();
            locationInput.value = '';
        });

        fuelForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const date = document.getElementById('date').value;
            const gallons = parseFloat(document.getElementById('gallons').value);
            const price = parseFloat(document.getElementById('price').value);
            const odometer = parseFloat(document.getElementById('odometer').value);
            const pdfFile = pdfUpload.files[0];

            const user = auth.currentUser;
            if (!user) {
                alert('You must be logged in to add a fuel purchase.');
                return;
            }

            try {
                // Show loading overlay and disable submit button
                loadingOverlay.style.display = 'flex';
                submitButton.disabled = true;

                // Upload PDF with progress tracking
                const pdfRef = storage.ref(`pdfs/${user.uid}_${Date.now()}_${pdfFile.name}`);
                const uploadTask = pdfRef.put(pdfFile);

                uploadTask.on('state_changed',
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    progressBarFill.style.width = progress + '%';
                    loadingText.textContent = `Uploading... ${Math.round(progress)}%`;
                },
                (error) => {
                    console.error('Upload error:', error);
                    alert('Error uploading file. Please try again.');
                    loadingOverlay.style.display = 'none';
                    submitButton.disabled = false;
                    progressBarFill.style.width = '0%';
                },
                async () => {
                    try {
                        loadingText.textContent = 'Saving purchase details...';
                        
                        const pdfUrl = await pdfRef.getDownloadURL();
                        const purchaseData = {
                            date,
                            gallons,
                            price,
                            odometer,
                            location: locationInput.value,
                            pdfUrl,
                            userId: user.uid
                        };

                        const newPurchaseRef = database.ref('fuel-purchases').push();
                        await newPurchaseRef.set(purchaseData);

                        // Update success modal with purchase details
                        document.querySelector('.success-date').textContent = new Date(date).toLocaleDateString();
                        document.querySelector('.success-gallons').textContent = gallons.toFixed(2);
                        document.querySelector('.success-price').textContent = price.toFixed(2);
                        document.querySelector('.success-total').textContent = (gallons * price).toFixed(2);
                        document.querySelector('.success-location').textContent = locationInput.value;
                        document.querySelector('.success-odometer').textContent = odometer.toLocaleString();

                        // Hide loading overlay and show success modal
                        loadingOverlay.style.display = 'none';
                        submitButton.disabled = false;
                        progressBarFill.style.width = '0%';
                        successModal.style.display = 'flex';
                    } catch (error) {
                        throw error;
                    }
                }
            );

            } catch (error) {
                console.error('Error adding fuel purchase:', error);
                alert('An error occurred while adding the fuel purchase. Please try again.');
                loadingOverlay.style.display = 'none';
                submitButton.disabled = false;
                progressBarFill.style.width = '0%';
            }
        });

    </script>
</body>
